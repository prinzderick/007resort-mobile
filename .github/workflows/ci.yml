name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Test (real-API integration test skips unless R007_API_BASE_URL is set)
        run: flutter test

  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build debug APK (real API; server address entered on the tablet)
        run: flutter build apk --debug
      - name: Keep the real-API APK
        run: cp build/app/outputs/flutter-apk/app-debug.apk build/007resort-mobile-debug.apk
      - name: Build demo APK (built-in mock server, R007_MOCK=true)
        run: flutter build apk --debug --dart-define=R007_MOCK=true
      - name: Keep the demo APK
        run: cp build/app/outputs/flutter-apk/app-debug.apk build/007resort-mobile-demo-mock.apk
      - uses: actions/upload-artifact@v4
        with:
          name: 007resort-mobile-debug-apk
          path: |
            build/007resort-mobile-debug.apk
            build/007resort-mobile-demo-mock.apk
          retention-days: 14

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
